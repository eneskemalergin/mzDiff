name: Citation

on:
  push:
    branches: [main]
    paths: ["CITATION.cff", ".github/workflows/citation.yml"]
  pull_request:
    branches: [main]
    paths: ["CITATION.cff", ".github/workflows/citation.yml"]
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    name: CITATION.cff
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate
        run: pipx run --spec cffconvert==2.0.0 cffconvert --validate -i CITATION.cff
